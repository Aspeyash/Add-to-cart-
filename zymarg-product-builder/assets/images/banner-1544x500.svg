<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    <linearGradient id="zpb-banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4f7a"/>
      <stop offset="50%" stop-color="#2271b1"/>
      <stop offset="100%" stop-color="#135e96"/>
    </linearGradient>
  </defs>
  <rect width="1544" height="500" fill="url(#zpb-banner-bg)"/>

  <!-- Decorative product page mockup on the right -->
  <g transform="translate(900, 80)" opacity="0.92">
    <!-- Gallery -->
    <rect x="0"   y="0" width="60"  height="280" rx="6" fill="#ffffff" opacity="0.18"/>
    <rect x="6"   y="6"  width="48" height="48" rx="4" fill="#ffffff" opacity="0.45"/>
    <rect x="6"   y="60" width="48" height="48" rx="4" fill="#ffffff" opacity="0.30"/>
    <rect x="6"   y="114" width="48" height="48" rx="4" fill="#ffffff" opacity="0.30"/>
    <rect x="70"  y="0" width="240" height="280" rx="6" fill="#ffffff" opacity="0.30"/>

    <!-- Swatches column -->
    <rect x="320" y="0" width="180" height="32" rx="4" fill="#ffffff" opacity="0.35"/>
    <rect x="320" y="42" width="32" height="32" rx="16" fill="#d94a3d"/>
    <rect x="358" y="42" width="32" height="32" rx="16" fill="#1f4d7a"/>
    <rect x="396" y="42" width="32" height="32" rx="16" fill="#3a8c4a"/>
    <rect x="320" y="100" width="180" height="20" rx="3" fill="#ffffff" opacity="0.35"/>
    <rect x="320" y="130" width="40" height="36" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="365" y="130" width="40" height="36" rx="4" fill="#ffffff" opacity="0.30"/>
    <rect x="410" y="130" width="40" height="36" rx="4" fill="#ffffff" opacity="0.30"/>
    <rect x="455" y="130" width="40" height="36" rx="4" fill="#ffffff" opacity="0.30"/>

    <!-- Add to cart column -->
    <rect x="510" y="0" width="120" height="50" rx="4" fill="#ffffff" opacity="0.18"/>
    <rect x="510" y="60" width="120" height="44" rx="4" fill="#f59f00"/>
    <rect x="510" y="114" width="120" height="44" rx="4" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Title -->
  <text x="80" y="170" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Zymarg Product Builder
  </text>

  <text x="80" y="230" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="500" fill="#ffffff" opacity="0.85">
    Connected Elementor widgets for WooCommerce
  </text>

  <text x="80" y="320" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="400" fill="#ffffff" opacity="0.75">
    Gallery &middot; Variation Swatches &middot; Add to Cart
  </text>
  <text x="80" y="356" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="400" fill="#ffffff" opacity="0.75">
    All in separate sections, all live-synced
  </text>
</svg>
